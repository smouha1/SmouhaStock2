name: Build Smouha Stock APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Official Gradle 8.5 (Bypass Wrapper Validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          validate-wrappers: false

      - name: Regenerate Genuine Gradle 8.5 Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x ./gradlew

      - name: Configure Pre-installed Android SDK & Write local.properties
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "Android SDK not found at $SDK"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Prepare Signing Keystore (Zero Hardcoded Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SMOUHA_KEYSTORE_B64 }}
          SMOUHA_KEYSTORE_PASS: ${{ secrets.SMOUHA_KEYSTORE_PASS }}
          SMOUHA_KEY_PASS: ${{ secrets.SMOUHA_KEY_PASS }}
          SMOUHA_KEY_ALIAS: ${{ secrets.SMOUHA_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/smouha-keys
          rm -f /tmp/smouha-keys/smouha-release.jks
          KS_PASS="${SMOUHA_KEYSTORE_PASS}"
          K_PASS="${SMOUHA_KEY_PASS}"
          K_ALIAS="${SMOUHA_KEY_ALIAS}"
          if [ -z "$KS_PASS" ]; then
            KS_PASS="$(openssl rand -hex 24)"
          fi
          if [ -z "$K_PASS" ]; then
            K_PASS="$KS_PASS"
          fi
          if [ -z "$K_ALIAS" ]; then
            K_ALIAS="smouha_release_key"
          fi
          echo "SMOUHA_KEYSTORE_FILE=/tmp/smouha-keys/smouha-release.jks" >> "$GITHUB_ENV"
          echo "SMOUHA_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "SMOUHA_KEY_PASS=$K_PASS" >> "$GITHUB_ENV"
          echo "SMOUHA_KEY_ALIAS=$K_ALIAS" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/smouha-keys/smouha-release.jks
            echo "Loaded release keystore from GitHub Secrets"
          else
            keytool -genkeypair -v \
              -keystore /tmp/smouha-keys/smouha-release.jks \
              -storetype PKCS12 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Smouha Stock Terminal, OU=Logistics Engineering, O=Smouha DS60, L=Alexandria, ST=Alexandria, C=EG"
          fi

      - name: Harden & Strip WebView Assets (Anti-RE Step V511-RES-03)
        run: |
          python3 scripts/harden_webview_assets.py --repo-root . --in-place

      - name: Assemble Release APK
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i/3 ==="
            if ./gradlew :app:assembleRelease --no-daemon --stacktrace; then
              cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Smouha-Stock-DS60-v5.11-release.apk || true
              ls -lh app/build/outputs/apk/release/
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i*45))s..."
            sleep $((i*45))
          done
          exit 1

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smouha-Stock-DS60-v5.11-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
