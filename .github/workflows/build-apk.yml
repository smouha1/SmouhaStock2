name: Build Smouha Stock APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Official Gradle 8.5 (Bypass Wrapper Checksum Validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          validate-wrappers: false

      - name: Generate Official Gradle Wrapper & Build Signed Release APK
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Generated APK Exists
        run: |
          ls -lh app/build/outputs/apk/release/Smouha-Stock-DS60-v5.0-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smouha-Stock-DS60-v5.0-APK
          path: app/build/outputs/apk/release/Smouha-Stock-DS60-v5.0-release.apk
          if-no-files-found: error
